name: Release

# 依 CHANGELOG.md 自動建立 tag 與 GitHub Release（D-107）。
# tag／Release 一律由 CI 建立，不手動做——雲端 Claude session 推不了 tag、也建不了 Release。
# 只在 main 跑：CHANGELOG 段落填上日期、合併進 main 才算正式上線；
# develop 上的日期還沒上線，不能在那邊建 Release。
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md']
  # 手動補跑用（例如某次執行失敗），一樣只允許在 main 上跑，見下面 job 的 if
  workflow_dispatch:

permissions:
  contents: write

# 同時有兩次執行的話排隊，不取消進行中的那次——避免兩次同時判斷「tag 不存在」而重複建立
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch 可以選任何分支，這裡再擋一次，確保只在 main 執行
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 腳本要從完整的 first-parent 歷史找出每個版本上線的 commit，也要看到既有 tag，
      # 所以要 fetch-depth: 0，不能用預設的 shallow clone
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/release-from-changelog.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
