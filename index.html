<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <!-- 網站 icon（D2：藏青圓角方塊＋Libre Caslon「IN」＋黃銅底線），由 design/icon/build.mjs 產生。
         現代瀏覽器用 SVG，舊瀏覽器退回 .ico；iOS 主畫面用 180px 方角 PNG（系統自己裁圓角） -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 站名跟 src/siteMeta.ts 的 SITE_TITLE 一致；進站後由 App.vue 依頁面改寫 -->
    <title>IN / ARCHIVE — Jerry Yeh</title>
    <meta
      name="description"
      content="Jerry Yeh 的私人藏書，公開目錄：文章、技術與專案編成可以查詢的目錄，彼此以雙向關係連結。"
    >
    <!-- 社群分享預覽（Open Graph）。這是 SPA，LinkedIn／LINE／Facebook 的爬蟲不跑 JavaScript，
         只讀得到這裡的靜態值，所以站內每個網址分享出去都是同一張卡片。
         og:image 也是 design/icon/build.mjs 產生的，網址要寫絕對路徑 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="IN / ARCHIVE">
    <meta property="og:title" content="IN / ARCHIVE — Jerry Yeh">
    <meta
      property="og:description"
      content="私人藏書，公開目錄：文章、技術與專案編成可以查詢的目錄，彼此以雙向關係連結。"
    >
    <meta property="og:url" content="https://jerrylib.com/">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:image" content="https://jerrylib.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="IN / ARCHIVE 字標，下方寫著「私人藏書，公開目錄」">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 標題字 Noto Serif TC（中文標題有真正的字形，不再落到各裝置的系統襯線字）＋
         字標專用的 Libre Caslon Text，只載 700 一個字重（D-60）。
         Google Fonts 會依 unicode-range 切片，中文字型只下載頁面實際用到的字 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@700&family=Noto+Serif+TC:wght@500;700;900&display=swap"
    >
    <!-- 原型測試：分類號印章字體，見 visual-design-language skill 的字型探索紀錄——
         只有兩個字重（400/700），還在評估要不要真的採用，不是定案 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
    >
    <script>
      // 在畫面畫出來之前就決定主題 class,避免先閃預設主題、再跳成使用者選的主題(FOUC)。
      try {
        if (localStorage.getItem('theme') === 'terminal') {
          document.documentElement.classList.add('theme-terminal')
        }
      } catch (e) {
        // 私密瀏覽模式擋 storage 時,就用預設主題,不影響網頁能不能用。
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
