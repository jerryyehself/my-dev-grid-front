<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,700&display=swap"
    >
    <!-- 原型測試：分類號印章字體，見 visual-design-language skill 的字型探索紀錄——
         只有兩個字重（400/700），還在評估要不要真的採用，不是定案 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap"
    >
    <script>
      // 在畫面畫出來之前就決定主題 class,避免先閃預設主題、再跳成使用者選的主題(FOUC)。
      try {
        if (localStorage.getItem('theme') === 'terminal') {
          document.documentElement.classList.add('theme-terminal')
        }
      } catch (e) {
        // 私密瀏覽模式擋 storage 時,就用預設主題,不影響網頁能不能用。
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
